[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pyomnikit"
version = "0.1.0"
description = "Algorithm-first toolkit for depth-robust program scoring, cross-species conservation, spatial-niche statistics and cross-omics integration in kidney-disease transcriptomics."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Lingzhang Meng", email = "m.lingzhang@hotmail.com" }]
keywords = ["bioinformatics", "single-cell", "multi-omics", "spatial-transcriptomics",
            "lupus-nephritis", "UCell", "program-conservation", "gene-signature"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["numpy>=1.22", "scipy>=1.8", "pandas>=1.4"]

[project.optional-dependencies]
plot = ["matplotlib>=3.5"]
dev = ["pytest>=7", "build", "twine"]

[project.urls]
Homepage = "https://github.com/LingzhangMeng/pyomnikit"
Repository = "https://github.com/LingzhangMeng/pyomnikit"
Issues = "https://github.com/LingzhangMeng/pyomnikit/issues"

[tool.setuptools.packages.find]
where = ["src"]
